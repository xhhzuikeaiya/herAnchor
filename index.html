<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVD Portal GA Compliance Roadmap</title>
  <style>
    .auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);display:flex;justify-content:center;align-items:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
    .auth-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:40px;width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1)}
    .auth-box h2{color:#fff;margin:0 0 8px;font-size:24px;text-align:center}
    .auth-box .hint{color:rgba(255,255,255,0.5);font-size:13px;text-align:center;margin-bottom:24px}
    .auth-box input{width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;font-size:15px;outline:none;box-sizing:border-box;margin-bottom:16px}
    .auth-box input:focus{border-color:#4f8cff}
    .auth-box button{width:100%;padding:12px;background:linear-gradient(135deg,#4f8cff,#6c63ff);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
    .auth-error{color:#ff6b6b;font-size:13px;text-align:center;margin-top:12px;display:none}
  </style>
</head>
<body>
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-box">
      <h2>🔐 访问受限</h2>
      <p class="hint">提示: hhhh</p>
      <input type="password" id="auth-password" placeholder="请输入访问密码" />
      <button onclick="checkPassword()">确认</button>
      <p id="auth-error" class="auth-error">密码错误</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" crossorigin src="/herAnchor/assets/index-H-RNO3-W.js"></script>
  <link rel="stylesheet" crossorigin href="/herAnchor/assets/index-DH5-6-sZ.css">
  <script>
    async function sha256(m){const e=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
    async function checkPassword(){const p=document.getElementById('auth-password').value;const h=await sha256(p);if(h==='ccb428594b31cd81833d3a5716669c3929e73a4652fd6a140ad4be9a1fef759e'){localStorage.setItem('roadmap_auth','1');document.getElementById('auth-overlay').style.display='none'}else{document.getElementById('auth-error').style.display='block'}}
    if(localStorage.getItem('roadmap_auth')==='1'){document.getElementById('auth-overlay').style.display='none'}
    document.getElementById('auth-password').addEventListener('keypress',e=>{if(e.key==='Enter')checkPassword()});
  </script>
</body>
</html>
